<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYT Analiz Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: #0d1322;
            --border-color: #172033;
            --text-main: #f3f4f6;
            --text-muted: #8a99ad;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Top App Bar (Görseldeki gibi Kod / Önizleme butonlu) */
        .top-app-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .app-title-mini {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
        }

        .view-toggle {
            display: flex;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background-color: var(--text-main);
            color: #000;
        }

        /* Header & Logo Area */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-text h1 span {
            color: var(--accent-orange);
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Tabs */
        .nav-tabs {
            display: flex;
            background-color: #0b101d;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            gap: 4px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-orange);
            color: #000;
            font-weight: 700;
        }

        /* Dashboard Grid Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media(max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-info .title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-info .value {
            font-size: 26px;
            font-weight: 800;
            margin-top: 4px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .icon-red { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .icon-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .icon-orange { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        /* Main Content Card */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .filter-pills {
            display: flex;
            background-color: #070a12;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            gap: 2px;
        }

        .pill {
            padding: 4px 8px;
            font-size: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
        }

        .pill.active {
            background-color: var(--accent-orange);
            color: #000;
            font-weight: 700;
        }

        .chart-box {
            position: relative;
            height: 220px;
            width: 100%;
        }

        /* Form elements */
        .tab-content { display: none; flex-direction: column; gap: 14px; }
        .tab-content.active { display: flex; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #070a12;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
        }

        .btn-submit {
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        /* List Items */
        .list-item {
            background-color: #070a12;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-del {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Kod / Önizleme Görünüm Alanları */
        #codeViewArea {
            display: none;
            background-color: #03050a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 12px;
            color: #34d399;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Üst Kontrol Barı (Görseldeki Kod / Önizleme Alanı) -->
    <div class="top-app-bar">
        <div class="app-title-mini">TYT Analiz Pro</div>
        <div class="view-toggle">
            <button class="toggle-btn" id="btnCode" onclick="toggleView('code')">Kod</button>
            <button class="toggle-btn active" id="btnPreview" onclick="toggleView('preview')">Önizle</button>
        </div>
    </div>

    <!-- KOD GÖRÜNÜMÜ ALANI -->
    <div id="codeViewArea"></div>

    <!-- ÖNİZLEME GÖRÜNÜMÜ ALANI -->
    <div id="previewContainer" style="display: flex; flex-direction: column; gap: 16px;">
        
        <!-- Üst Bar: Logo ve Menü -->
        <div class="top-header">
            <div class="brand">
                <div class="brand-icon">📈</div>
                <div class="brand-text">
                    <h1>TYT ANALİZ <span>PRO</span></h1>
                    <p>YKS & TYT Sınav Takip ve Net Analiz Sistemi</p>
                </div>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('genel')">📊 Genel İstatistikler</button>
                <button class="tab-btn" onclick="switchTab('deneme')">📁 Denemelerim</button>
                <button class="tab-btn" onclick="switchTab('yanlis')">📋 Ortak Yanlışlar Tablosu</button>
            </div>
        </div>

        <!-- 1. GENEL İSTATİSTİKLER TABI -->
        <div id="genel" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <div class="title">TOPLAM DENEME</div>
                        <div class="value" id="valDeneme">0</div>
                    </div>
                    <div class="stat-icon icon-blue">📝</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <div class="title">TOPLAM YANLIŞ SORU</div>
                        <div class="value" id="valYanlis" style="color:#f87171;">0</div>
                    </div>
                    <div class="stat-icon icon-red">⚠️</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <div class="title">ÇÖZÜLEN / ANLAŞILAN</div>
                        <div class="value" id="valCozulen" style="color:#34d399;">0</div>
                    </div>
                    <div class="stat-icon icon-green">✓</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <div class="title">BEKLEYEN YANLIŞLAR</div>
                        <div class="value" id="valBekleyen" style="color:#fbbf24;">0</div>
                    </div>
                    <div class="stat-icon icon-orange">⏳</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">📈 Net Takip Grafiği & Gelişim Eğrisi</div>
                    <div class="filter-pills">
                        <button class="pill">Haftalık</button>
                        <button class="pill">Birkaç Haftalık</button>
                        <button class="pill">Bir Aylık</button>
                        <button class="pill active">Tümü</button>
                    </div>
                </div>
                <div class="chart-box">
                    <canvas id="netChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 2. DENEMELERİM TABI -->
        <div id="deneme" class="tab-content">
            <div class="card">
                <div class="card-title" style="margin-bottom: 12px;">Deneme Sonucu Ekle</div>
                <div class="form-group">
                    <label>Deneme Adı / Yayın</label>
                    <input type="text" id="dAdi" placeholder="Örn: Hız ve Renk TYT">
                </div>
                <div class="form-group">
                    <label>Toplam Net</label>
                    <input type="number" step="0.25" id="dNet" placeholder="Örn: 75.5">
                </div>
                <div class="form-group">
                    <label>Tarih</label>
                    <input type="date" id="dTarih">
                </div>
                <button class="btn-submit" onclick="ekleDeneme()">Kaydet ve Grafiğe İşle</button>
            </div>

            <div class="card">
                <div class="card-title" style="margin-bottom: 12px;">Geçmiş Denemeler</div>
                <div id="listDeneme"></div>
            </div>
        </div>

        <!-- 3. YANLIŞ DEFTERİ TABI (TÜM İSTENEN KONULAR) -->
        <div id="yanlis" class="tab-content">
            <div class="card">
                <div class="card-title" style="margin-bottom: 12px;">Yanlış Soru Kaydı</div>
                <div class="form-group">
                    <label>Ders</label>
                    <select id="dersSel" onchange="loadKonular()">
                        <option value="Turkce">Türkçe</option>
                        <option value="Matematik">Matematik</option>
                        <option value="Geometri">Geometri</option>
                        <option value="Fizik">Fizik</option>
                        <option value="Kimya">Kimya</option>
                        <option value="Biyoloji">Biyoloji</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Konu</label>
                    <select id="konuSel"></select>
                </div>
                <div class="form-group">
                    <label>Not / Hata Nedeni</label>
                    <textarea id="yNot" rows="2" placeholder="Dikkatsizlik, formül unutuldu vb."></textarea>
                </div>
                <button class="btn-submit" onclick="ekleYanlis()">Deftere Ekle</button>
            </div>

            <div class="card">
                <div class="card-title" style="margin-bottom: 12px;">Yanlış Sorular Listesi</div>
                <div id="listYanlis"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Tam İstediğin Güncel Konu Listeleri
    const konularData = {
        "Turkce": ["1. Sözcükte Anlam", "2. Cümlede Anlam", "3. Paragraf", "4. Ses Bilgisi", "5. Yazım Kuralları", "6. Noktalama İşaretleri", "7. Sözcükte Yapı", "8. Sözcük Türleri", "9. Fiiller", "10. Cümlenin Ögeleri", "11. Cümle Türleri", "Anlatım Bozukluğu"],
        "Matematik": ["Temel Kavramlar", "Sayı Basamakları", "Bölme ve Bölünebilme", "EBOB – EKOK", "Rasyonel Sayılar", "Basit Eşitsizlikler", "Mutlak Değer", "Üslü Sayılar", "Köklü Sayılar", "Çarpanlara Ayırma", "Oran Orantı", "Denklem Çözme", "Sayı Problemleri", "Kesir Problemleri", "Yaş Problemleri", "Hareket Hız Problemleri", "İşçi Emek Problemleri", "Yüzde Problemleri", "Kar Zarar Problemleri", "Karışım Problemleri", "Grafik Problemleri", "Rutin Olmayan Problemleri", "Kümeler – Kartezyen Çarpım", "Mantık", "Fonksiyonlar", "Polinomlar", "2.Dereceden Denklemler", "Permütasyon ve Kombinasyon", "Olasılık", "Veri – İstatistik"],
        "Geometri": ["Doğruda Açılar", "Üçgende Açılar", "Eşkenar Üçgen", "Açıortay", "Kenarortay", "Eşlik ve Benzerlik", "Üçgende Alan", "Üçgende Benzerlik", "Açı Kenar Bağıntıları", "Çokgenler", "Özel Dörtgenler", "Çember ve Daire", "Analitik Geometri", "Katı Cisimler", "Çemberin Analitiği"],
        "Fizik": ["Fizik Bilimine Giriş", "Madde ve Özellikleri", "Sıvıların Kaldırma Kuvveti", "Basınç", "Isı, Sıcaklık ve Genleşme", "Hareket ve Kuvvet", "Dinamik", "İş, Güç ve Enerji", "Elektrik", "Manyetizma", "Dalgalar", "Optik"],
        "Kimya": ["Kimya Bilimi", "Atom ve Periyodik Sistem", "Kimyasal Türler Arası Etkileşimler", "Maddenin Halleri", "Doğa ve Kimya", "Kimyanın Temel Kanunları", "Kimyasal Hesaplamalar", "Karışımlar", "Asit, Baz ve Tuz", "Kimya Her Yerde"],
        "Biyoloji": ["Canlıların Ortak Özellikleri", "Canlıların Temel Bileşenleri", "Hücre ve Organelleri", "Hücre Zarından Madde Geçişi", "Canlıların Sınıflandırılması", "Mitoz ve Eşeysiz Üreme", "Mayoz ve Eşeyli Üreme", "Kalıtım", "Ekosistem Ekolojisi", "Güncel Çevre Sorunları"]
    };

    let denemeler = JSON.parse(localStorage.getItem('tyt_d')) || [];
    let yanlislar = JSON.parse(localStorage.getItem('tyt_y')) || [];
    let chartInstance = null;

    function toggleView(mode) {
        const codeArea = document.getElementById('codeViewArea');
        const previewArea = document.getElementById('previewContainer');
        const btnC = document.getElementById('btnCode');
        const btnP = document.getElementById('btnPreview');

        if(mode === 'code') {
            codeArea.style.display = 'block';
            previewArea.style.display = 'none';
            btnC.classList.add('active');
            btnP.classList.remove('active');
            codeArea.textContent = document.documentElement.outerHTML;
        } else {
            codeArea.style.display = 'none';
            previewArea.style.display = 'flex';
            btnP.classList.add('active');
            btnC.classList.remove('active');
        }
    }

    function switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        if(id === 'genel') renderAll();
    }

    function loadKonular() {
        const ders = document.getElementById('dersSel').value;
        const kSel = document.getElementById('konuSel');
        kSel.innerHTML = '';
        konularData[ders].forEach(k => {
            let opt = document.createElement('option');
            opt.value = k; opt.textContent = k;
            kSel.appendChild(opt);
        });
    }

    function ekleDeneme() {
        const adi = document.getElementById('dAdi').value;
        const net = parseFloat(document.getElementById('dNet').value);
        const tarih = document.getElementById('dTarih').value || new Date().toISOString().split('T')[0];
        if(!adi || isNaN(net)) return alert('Lütfen bilgileri doldurun.');
        denemeler.push({ adi, net, tarih });
        localStorage.setItem('tyt_d', JSON.stringify(denemeler));
        document.getElementById('dAdi').value = ''; document.getElementById('dNet').value = '';
        renderAll();
    }

    function ekleYanlis() {
        const ders = document.getElementById('dersSel').value;
        const konu = document.getElementById('konuSel').value;
        const notu = document.getElementById('yNot').value;
        yanlislar.push({ ders, konu, notu });
        localStorage.setItem('tyt_y', JSON.stringify(yanlislar));
        document.getElementById('yNot').value = '';
        renderAll();
    }

    function silDeneme(i) { denemeler.splice(i,1); localStorage.setItem('tyt_d', JSON.stringify(denemeler)); renderAll(); }
    function silYanlis(i) { yanlislar.splice(i,1); localStorage.setItem('tyt_y', JSON.stringify(yanlislar)); renderAll(); }

    function renderAll() {
        document.getElementById('valDeneme').textContent = denemeler.length;
        document.getElementById('valYanlis').textContent = yanlislar.length;
        document.getElementById('valCozulen').textContent = "0";
        document.getElementById('valBekleyen').textContent = yanlislar.length;

        const dL = document.getElementById('listDeneme');
        dL.innerHTML = denemeler.length ? '' : '<div style="color:#8a99ad; font-size:12px;">Henüz eklenmedi.</div>';
        denemeler.forEach((d, i) => {
            dL.innerHTML += `<div class="list-item"><div><b>${d.adi}</b> <span style="color:#8a99ad; font-size:12px;">(${d.tarih})</span><br><span style="color:#f59e0b;">${d.net} Net</span></div><button class="btn-del" onclick="silDeneme(${i})">Sil</button></div>`;
        });

        const yL = document.getElementById('listYanlis');
        yL.innerHTML = yanlislar.length ? '' : '<div style="color:#8a99ad; font-size:12px;">Henüz eklenmedi.</div>';
        yanlislar.forEach((y, i) => {
            yL.innerHTML += `<div class="list-item"><div><b>[${y.ders}] ${y.konu}</b><br><span style="color:#8a99ad; font-size:12px;">${y.notu || 'Not yok'}</span></div><button class="btn-del" onclick="silYanlis(${i})">Sil</button></div>`;
        });

        const ctx = document.getElementById('netChart').getContext('2d');
        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: denemeler.map(d => d.adi),
                datasets: [{
                    label: 'Net Grafiği',
                    data: denemeler.map(d => d.net),
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#172033' }, ticks: { color: '#8a99ad' } },
                    x: { grid: { color: '#172033' }, ticks: { color: '#8a99ad' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    loadKonular();
    renderAll();
</script>

</body>
</html>
