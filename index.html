<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYT Analiz Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #22c55e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.5rem; color: var(--text); margin-bottom: 4px; }
        p.subtitle { color: var(--text-muted); font-size: 0.875rem; }
        .card { background-color: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 4px; }
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; text-align: center; }
        .stat-box { background: var(--card); padding: 12px; border-radius: 8px; }
        .stat-value { font-size: 1.25rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); }
        ul { list-style: none; }
        li { background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TYT Analiz Pro</h1>
            <p class="subtitle">Yanlış Takibi & Net Hesaplama</p>
        </header>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="totalWrong">0</div>
                <div class="stat-label">Toplam Yanlış</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalCorrect">0</div>
                <div class="stat-label">Tahmini Doğru</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="estimatedNet">0.00</div>
                <div class="stat-label">Tahmini Net</div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 1rem;">Yeni Yanlış Ekle</h3>
            <div class="form-group">
                <label>Ders</label>
                <select id="lesson">
                    <option value="Türkçe">Türkçe</option>
                    <option value="Matematik">Matematik</option>
                    <option value="Sosyal Bilimler">Sosyal Bilimler</option>
                    <option value="Fen Bilimleri">Fen Bilimleri</option>
                </select>
            </div>
            <div class="form-group">
                <label>Konu / Açıklama</label>
                <input type="text" id="topic" placeholder="Örn: Paragraf - Ana Düşünce">
            </div>
            <button onclick="addWrong()">Yanlış Kaydet</button>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 1rem;">Yanlış Listesi</h3>
            <ul id="wrongList"></ul>
        </div>
    </div>

    <script>
        let wrongs = JSON.parse(localStorage.getItem('tyt_wrongs')) || [];

        function render() {
            const list = document.getElementById('wrongList');
            list.innerHTML = '';
            let counts = { Türkçe: 0, Matematik: 0, 'Sosyal Bilimler': 0, 'Fen Bilimleri': 0 };
            
            wrongs.forEach((item, index) => {
                counts[item.lesson]++;
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>[${item.lesson}]</strong> ${item.topic}</span> <button class="delete-btn" onclick="removeWrong(${index})">Sil</button>`;
                list.appendChild(li);
            });

            document.getElementById('totalWrong').innerText = wrongs.length;
            let totalCorrectEst = Math.max(0, 120 - (wrongs.length * 1.25));
            let net = totalCorrectEst - (wrongs.length * 0.25);
            document.getElementById('estimatedNet').innerText = net.toFixed(2);
            document.getElementById('totalCorrect').innerText = Math.round(totalCorrectEst);
            
            localStorage.setItem('tyt_wrongs', JSON.stringify(wrongs));
        }

        function addWrong() {
            const lesson = document.getElementById('lesson').value;
            const topic = document.getElementById('topic').value.trim();
            if(!topic) return alert('Lütfen konu veya açıklama girin!');
            wrongs.push({ lesson, topic });
            document.getElementById('topic').value = '';
            render();
        }

        function removeWrong(index) {
            wrongs.splice(index, 1);
            render();
        }

        render();
    </script>
</body>
</html>
